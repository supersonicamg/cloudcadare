name: ci
on:
  pull_request:
  push:
    branches: [main]

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4          # version comes from "packageManager" in package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22                  # Tailwind 4.3 needs require(esm): Node >= 20.19
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo run typecheck lint test build

  database:
    # Applies every migration to a throwaway Supabase Postgres, runs the smoke test and the 7 lints.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: ./packages/db/tests/run_local.sh
